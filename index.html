<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Đơn Nghỉ Phép</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- ================= 1. TRANG CHỦ ================= -->
    <div id="homePage" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Hệ Thống Đơn Nghỉ Phép</h1>
            <p class="text-slate-500 mb-8 text-sm">Vui lòng chọn vai trò của bạn</p>
            
            <div class="space-y-4">
                <button onclick="switchView('employee')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition shadow-md">
                    📝 Trang Nhân Viên (Gửi đơn)
                </button>
                <button onclick="switchView('accountant')" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 px-4 rounded-xl transition shadow-md">
                    📊 Trang Kế Toán (Dashboard)
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. TRANG NHÂN VIÊN ================= -->
    <div id="employeePage" class="hidden flex-1 p-4 max-w-xl mx-auto w-full my-8">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">Tạo Đơn Xin Nghỉ Phép</h2>
                <button onclick="switchView('home')" class="text-sm text-blue-600 hover:underline">← Về trang chủ</button>
            </div>

            <form id="leaveForm" onsubmit="submitLeaveForm(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
                    <input type="text" id="hoTen" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Phòng ban</label>
                    <input type="text" id="phongBan" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Loại nghỉ</label>
                    <select id="loaiNghi" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Phép năm">Phép năm</option>
                        <option value="Nghỉ ốm">Nghỉ ốm</option>
                        <option value="Việc riêng / Không lương">Việc riêng / Không lương</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Từ ngày</label>
                        <input type="date" id="tuNgay" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Đến ngày</label>
                        <input type="date" id="denNgay" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Buổi nghỉ</label>
                    <select id="buoiNghi" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Cả ngày">Cả ngày</option>
                        <option value="Buổi sáng">Buổi sáng</option>
                        <option value="Buổi chiều">Buổi chiều</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Lý do xin nghỉ</label>
                    <textarea id="lyDo" rows="3" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">Gửi Đơn</button>
            </form>
            <div id="formMessage" class="mt-4 text-center text-sm font-medium"></div>
        </div>
    </div>

    <!-- ================= 3. TRANG KẾ TOÁN (DASHBOARD) ================= -->
    <div id="accountantPage" class="hidden flex-1 p-4 max-w-7xl mx-auto w-full my-8">
        <!-- Login Form -->
        <div id="loginSection" class="bg-white p-8 rounded-2xl shadow-xl max-w-md mx-auto mt-12">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-800">Đăng Nhập Kế Toán</h2>
                <button onclick="switchView('home')" class="text-sm text-blue-600 hover:underline">← Về trang chủ</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu Dashboard</label>
                    <input type="password" id="accPassword" placeholder="Nhập mật khẩu (ketoan123)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none">
                </div>
                <button onclick="handleLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 rounded-xl transition">Đăng Nhập</button>
                <p id="loginError" class="text-red-500 text-sm text-center"></p>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden bg-white p-6 rounded-2xl shadow-xl space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-center pb-4 border-b gap-4">
                <h2 class="text-xl font-bold text-slate-800">📊 Quản Lý Đơn Xin Nghỉ</h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="loadDashboardData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">🔄 Làm mới</button>
                    <button onclick="confirmClearAll()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">🗑️ Xóa toàn bộ</button>
                    <button onclick="logoutToHome()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">🏠 Về trang chủ</button>
                </div>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50 p-4 rounded-xl">
                <div class="w-full sm:w-80">
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 Tìm kiếm theo tên..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="text-xs text-slate-500">Tổng số đơn: <span id="totalRecords" class="font-bold text-slate-800">0</span></div>
            </div>

            <!-- Bảng dữ liệu (Không có cột Thao tác sửa/xóa từng dòng) -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs uppercase tracking-wider">
                            <th class="p-3">Thời gian</th>
                            <th class="p-3">Họ và tên</th>
                            <th class="p-3">Phòng ban</th>
                            <th class="p-3">Loại nghỉ</th>
                            <th class="p-3">Từ ngày</th>
                            <th class="p-3">Đến ngày</th>
                            <th class="p-3">Buổi</th>
                            <th class="p-3">Lý do</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-slate-200 text-sm text-slate-600"></tbody>
                </table>
            </div>

            <!-- Phân trang -->
            <div class="flex justify-between items-center pt-4 border-t">
                <div class="text-sm text-slate-500">Trang <span id="currentPageText">1</span> / <span id="totalPagesText">1</span></div>
                <div class="flex space-x-2">
                    <button onclick="changePage(-1)" id="btnPrevPage" class="px-4 py-2 bg-slate-100 rounded-lg text-sm disabled:opacity-50">← Trước</button>
                    <button onclick="changePage(1)" id="btnNextPage" class="px-4 py-2 bg-slate-100 rounded-lg text-sm disabled:opacity-50">Sau →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL XÁC NHẬN XÓA TOÀN BỘ ================= -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl text-center">
            <div class="text-red-500 text-4xl">⚠️</div>
            <h3 class="text-lg font-bold text-slate-800">Xác nhận xóa toàn bộ?</h3>
            <p class="text-sm text-slate-500">Hành động này sẽ xóa sạch tất cả đơn xin nghỉ!</p>
            <div class="flex justify-center space-x-3 pt-2">
                <button onclick="closeConfirmModal()" class="px-4 py-2 bg-slate-200 rounded-lg text-sm">Hủy bỏ</button>
                <button onclick="executeClearAll()" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium">Đồng ý Xóa</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const WEB_APP_URL = CONFIG.LEAVE_API_URL;
        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const rowsPerPage = 5;

        // Kiểm tra trạng thái đăng nhập khi vừa load trang
        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                document.getElementById('homePage').classList.add('hidden');
                document.getElementById('accountantPage').classList.remove('hidden');
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadDashboardData();
            }
        };

        function switchView(viewName) {
            document.getElementById('homePage').classList.add('hidden');
            document.getElementById('employeePage').classList.add('hidden');
            document.getElementById('accountantPage').classList.add('hidden');

            if (viewName === 'home') {
                document.getElementById('homePage').classList.remove('hidden');
            } else if (viewName === 'employee') {
                document.getElementById('employeePage').classList.remove('hidden');
            } else if (viewName === 'accountant') {
                document.getElementById('accountantPage').classList.remove('hidden');
                if (sessionStorage.getItem("isLoggedIn") === "true") {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadDashboardData();
                } else {
                    document.getElementById('loginSection').classList.remove('hidden');
                    document.getElementById('dashboardSection').classList.add('hidden');
                    document.getElementById('accPassword').value = '';
                    document.getElementById('loginError').innerText = '';
                }
            }
        }

        // Nút về trang chủ từ Dashboard sẽ xóa trạng thái đăng nhập
        function logoutToHome() {
            sessionStorage.removeItem("isLoggedIn");
            switchView('home');
        }

        function submitLeaveForm(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const msg = document.getElementById('formMessage');
            submitBtn.disabled = true;
            submitBtn.innerText = "Đang gửi...";

            const payload = {
                hoTen: document.getElementById('hoTen').value,
                phongBan: document.getElementById('phongBan').value,
                loaiNghi: document.getElementById('loaiNghi').value,
                tuNgay: document.getElementById('tuNgay').value,
                denNgay: document.getElementById('denNgay').value,
                buoiNghi: document.getElementById('buoiNghi').value,
                lyDo: document.getElementById('lyDo').value
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    msg.className = "mt-4 text-center text-sm font-medium text-green-600";
                    msg.innerText = "🎉 Gửi đơn thành công!";
                    document.getElementById('leaveForm').reset();
                } else throw new Error(data.message);
            })
            .catch(err => {
                msg.className = "mt-4 text-center text-sm font-medium text-red-600";
                msg.innerText = "❌ Lỗi: " + err.message;
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Gửi Đơn";
            });
        }

        function handleLogin() {
            const password = document.getElementById('accPassword').value;
            const errTag = document.getElementById('loginError');

            fetch(`${WEB_APP_URL}?action=login&password=${encodeURIComponent(password)}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    sessionStorage.setItem("isLoggedIn", "true"); // Lưu trạng thái đăng nhập
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    loadDashboardData();
                } else errTag.innerText = "Sai mật khẩu!";
            })
            .catch(() => errTag.innerText = "Lỗi kết nối server!");
        }

        function loadDashboardData() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-400">Đang tải dữ liệu...</td></tr>`;

            fetch(`${WEB_APP_URL}?action=getData`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    rawData = data.data;
                    filteredData = [...rawData];
                    currentPage = 1;
                    renderTable();
                }
            })
            .catch(() => tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-red-500">Lỗi tải dữ liệu!</td></tr>`);
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = "";
            document.getElementById('totalRecords').innerText = filteredData.length;

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-400">Không có dữ liệu.</td></tr>`;
                updatePaginationControls(0);
                return;
            }

            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const pageData = filteredData.slice(startIndex, startIndex + rowsPerPage);

            pageData.forEach(row => {
                let timeStr = row.thoiGian ? new Date(row.thoiGian).toLocaleString('vi-VN') : '';
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3">${timeStr}</td>
                    <td class="p-3 font-medium text-slate-800">${row.hoTen}</td>
                    <td class="p-3">${row.phongBan}</td>
                    <td class="p-3"><span class="px-2 py-1 bg-blue-50 text-blue-700 rounded-md text-xs">${row.loaiNghi}</span></td>
                    <td class="p-3">${row.tuNgay}</td>
                    <td class="p-3">${row.denNgay}</td>
                    <td class="p-3">${row.buoiNghi}</td>
                    <td class="p-3 max-w-xs truncate" title="${row.lyDo}">${row.lyDo}</td>
                `;
                tbody.appendChild(tr);
            });

            updatePaginationControls(totalPages);
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredData = rawData.filter(item => item.hoTen.toLowerCase().includes(keyword));
            currentPage = 1;
            renderTable();
        }

        function updatePaginationControls(totalPages) {
            document.getElementById('currentPageText').innerText = totalPages === 0 ? 0 : currentPage;
            document.getElementById('totalPagesText').innerText = totalPages;
            document.getElementById('btnPrevPage').disabled = currentPage <= 1;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages || totalPages === 0;
        }

        function changePage(delta) {
            currentPage += delta;
            renderTable();
        }

        function confirmClearAll() {
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        function executeClearAll() {
            closeConfirmModal();
            fetch(`${WEB_APP_URL}?action=clearData`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") loadDashboardData();
            });
        }
    </script>
</body>
</html>
