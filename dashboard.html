<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tổng Hợp Nghỉ Phép - Kế Toán</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4">
    
    <!-- Màn hình đăng nhập -->
    <div id="loginScreen" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-20">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Đăng Nhập Kế Toán</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Mật khẩu truy cập</label>
                <input type="password" id="passwordInput" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-green-500 focus:border-green-500">
            </div>
            <button onclick="handleLogin()" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 font-medium">Đăng Nhập</button>
            <p id="loginError" class="text-red-500 text-sm text-center"></p>
        </div>
    </div>

    <!-- Màn hình Dashboard (Ẩn khi chưa đăng nhập) -->
    <div id="dashboardScreen" class="max-w-7xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Tổng Hợp Đơn Xin Nghỉ Phép</h1>
            <div class="flex space-x-3">
                <!-- Nút xóa toàn bộ dữ liệu -->
                <button onclick="handleClearData()" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 text-sm font-medium shadow">Xóa Toàn Bộ Dữ Liệu</button>
                <!-- Nút đăng xuất -->
                <button onclick="handleLogout()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 text-sm font-medium shadow">Đăng xuất</button>
            </div>
        </div>

        <!-- Thống kê nhanh -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Tổng số lượt nghỉ</p>
                <p id="totalRequests" class="text-2xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Nhân sự nghỉ trong hệ thống</p>
                <p id="monthlyCount" class="text-2xl font-bold text-gray-800">0</p>
            </div>
        </div>

        <!-- Bảng danh sách chi tiết -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-700">Danh Sách Chi Tiết</h3>
                <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên nhân viên..." onkeyup="filterTable()" class="border rounded-md px-3 py-2 text-sm w-72 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thời gian gửi</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Họ và tên</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Bộ phận</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Loại nghỉ</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Từ ngày</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Đến ngày</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Buổi</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lý do</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200 text-sm">
                        <!-- Dữ liệu được nhúng bằng JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCvFqn2kwf8cD2R1OIo_dArXcBqVeQHB06rPC6oXBpEPo0wRd_JBACQ7HBQ4mTeXmirQ/exec"; 
        let allData = [];

        // Kiểm tra trạng thái đăng nhập lưu trong trình duyệt khi vừa mở trang
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                showDashboard();
            }
        };

        function handleLogin() {
            const pass = document.getElementById('passwordInput').value;
            const err = document.getElementById('loginError');
            err.innerText = "Đang kiểm tra...";

            fetch(`${SCRIPT_URL}?action=login&password=${encodeURIComponent(pass)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    localStorage.setItem("isLoggedIn", "true"); // Lưu trạng thái
                    showDashboard();
                } else {
                    err.innerText = "Sai mật khẩu, vui lòng thử lại!";
                }
            })
            .catch(() => {
                err.innerText = "Lỗi kết nối tới hệ thống!";
            });
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            loadDashboardData();
        }

        function handleLogout() {
            localStorage.removeItem("isLoggedIn"); // Xóa trạng thái lưu
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('passwordInput').value = "";
            document.getElementById('loginError').innerText = "";
        }

        // Chức năng xóa toàn bộ dữ liệu
        function handleClearData() {
            if (confirm("Cảnh báo: Bạn có chắc chắn muốn xóa toàn bộ dữ liệu đơn xin nghỉ không? Hành động này không thể khôi phục!")) {
                fetch(`${SCRIPT_URL}?action=clearData`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        alert("Đã xóa toàn bộ dữ liệu thành công!");
                        loadDashboardData();
                    } else {
                        alert("Có lỗi xảy ra khi xóa dữ liệu!");
                    }
                })
                .catch(() => {
                    alert("Lỗi kết nối tới hệ thống!");
                });
            }
        }

        function loadDashboardData() {
            fetch(`${SCRIPT_URL}?action=getData`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    allData = res.data;
                    renderTable(allData);
                    document.getElementById('totalRequests').innerText = allData.length;
                    document.getElementById('monthlyCount').innerText = allData.length;
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-6 text-center text-gray-500">Chưa có dữ liệu đơn nghỉ nào</td></tr>`;
                return;
            }

            data.forEach(row => {
                let formattedTime = row.thoiGian;
                try {
                    formattedTime = new Date(row.thoiGian).toLocaleString('vi-VN');
                } catch(e) {}

                let tr = document.createElement('tr');
                // Đã bỏ các class truncate/max-w để chữ dài tự động xuống dòng và hiển thị đầy đủ
                tr.innerHTML = `
                    <td class="px-4 py-4 whitespace-nowrap text-gray-500 text-xs">${formattedTime}</td>
                    <td class="px-4 py-4 whitespace-nowrap font-medium text-gray-900">${row.hoTen || ''}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-gray-600">${row.phongBan || ''}</td>
                    <td class="px-4 py-4 whitespace-nowrap">
                        <span class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                            ${row.loaiNghi || ''}
                        </span>
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-gray-600">${row.tuNgay || ''}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-gray-600">${row.denNgay || ''}</td>
                    <td class="px-4 py-4 whitespace-nowrap text-gray-600">${row.buoiNghi || ''}</td>
                    <td class="px-4 py-4 text-gray-600 break-words">${row.lyDo || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item => (item.hoTen || '').toLowerCase().includes(keyword));
            renderTable(filtered);
        }
    </script>
</body>
</html>
